<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0">
  <title>Edwin J. Kiest Coatls - Registrar Portal</title>
  <!-- Lightweight QR Code Generator for Car Tags -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --coatl-red: #C8232C;
      --coatl-navy: #13264E;
      --coatl-teal: #00A8E8;
      --coatl-bg: #F4F6F9;
      --coatl-card-bg: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Times New Roman', Times, serif;
      background: var(--coatl-bg);
      color: var(--coatl-navy);
      margin: 0;
      padding: 18px;
    }
    .container { max-width: 1120px; margin: auto; }

    /* Header & Mode Tabs */
    .header {
      background: var(--coatl-card-bg);
      padding: 16px 24px;
      border-radius: 12px;
      border-top: 8px solid var(--coatl-red);
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h2 { margin: 0; color: var(--coatl-navy); text-transform: uppercase; font-size: 20px; letter-spacing: 0.5px; font-family: 'Segoe UI', Arial, sans-serif; }
    .subtitle { font-size: 12px; color: var(--coatl-red); font-weight: 800; margin-top: 2px; letter-spacing: 0.5px; font-family: 'Segoe UI', Arial, sans-serif; }
    .status-pill {
      background: #e0f7fa; color: #0b4f6c; padding: 6px 14px;
      border-radius: 20px; font-weight: 700; font-size: 13px;
      border: 1px solid #b2ebf2; font-family: 'Segoe UI', Arial, sans-serif;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: var(--coatl-navy);
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { border-color: var(--coatl-teal); }
    .tab-btn.active {
      background: var(--coatl-navy);
      color: #ffffff;
      border-color: var(--coatl-navy);
      box-shadow: 0 4px 12px rgba(19, 38, 78, 0.2);
    }

    /* Layout & Cards */
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
      align-items: start;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    @media (max-width: 850px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--coatl-card-bg);
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      border-bottom: 6px solid var(--coatl-teal);
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .card h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      text-transform: uppercase;
      color: var(--coatl-navy);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--coatl-navy);
      margin-bottom: 5px;
      letter-spacing: 0.4px;
    }
    .req { color: var(--coatl-red); }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      color: var(--coatl-navy);
      background: #f8fafc;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--coatl-teal);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.15);
    }
    .helper-text { font-size: 11px; color: #64748b; margin-top: 4px; }

    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    .btn-primary {
      flex: 1;
      background: var(--coatl-navy);
      color: #ffffff;
      border: none;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-primary:hover { background: #1e3a75; }
    .btn-print {
      background: var(--coatl-red);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-print:hover { background: #a81c24; }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #e2e8f0; }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 15px;
      display: none;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    /* Directory Table */
    .search-bar { margin-bottom: 12px; }
    .table-wrap {
      max-height: 490px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th {
      background: var(--coatl-navy);
      color: #fff;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 600;
    }
    tr:hover td { background: #f8fafc; }
    .mini-btn {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      margin-right: 4px;
    }
    .mini-btn:hover { background: #bae6fd; }
    .mini-btn-tag {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .mini-btn-tag:hover { background: #fecaca; }

    /* =====================================================================
       2 PER PAGE PORTRAIT CAR TAG LAYOUT (NO DEAD SPACE / FULL DIVIDERS)
       ===================================================================== */
    .tag-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 2px solid #f1f5f9;
    }
