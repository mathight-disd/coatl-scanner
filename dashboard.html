<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <title>Kiest Coatls Dismissal Dashboard</title>
  <style>
    :root {
      --coatl-red: #C8232C;
      --coatl-navy: #13264E;
      --coatl-teal: #00A8E8;
      --coatl-bg: #F4F6F9;
    }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background: var(--coatl-bg); font-family: 'Segoe UI', Arial, sans-serif; color: var(--coatl-navy);
    }
    .container { 
      max-width: 800px; margin: 20px auto; background: #ffffff; padding: 20px; 
      border-radius: 16px; border-top: 10px solid var(--coatl-red); border-bottom: 6px solid var(--coatl-teal);
      box-shadow: 0 6px 20px rgba(19, 38, 78, 0.15); box-sizing: border-box;
    }
    .header-area { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; text-align: center; }
    .header-area img { max-height: 65px; width: auto; margin-bottom: 6px; }
    h1 { margin: 4px 0; font-size: 22px; text-transform: uppercase; color: var(--coatl-navy); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 14px; text-align: center; }
    .stat-card h3 { margin: 0 0 6px 0; font-size: 14px; color: #64748b; text-transform: uppercase; }
    .stat-card .value { font-size: 26px; font-weight: 900; color: var(--coatl-navy); }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .refresh-btn {
      background: var(--coatl-teal); color: #fff; border: none; padding: 10px 16px;
      font-size: 14px; font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f1f5f9; color: var(--coatl-navy); font-weight: 800; }
    tr:hover { background: #f8fafc; }
    #statusMsg { font-size: 13px; color: #64748b; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-area">
      <img src="logo.png" alt="Kiest Coatls Logo">
      <h1>Dismissal Live Dashboard</h1>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Dismissed Today</h3>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <h3>Active Location</h3>
        <div class="value" id="activeLoc" style="font-size: 18px; margin-top: 4px;">Live Feed</div>
      </div>
    </div>

    <div class="actions-bar">
      <span style="font-weight: 700; font-size: 15px;">Recent Dismissal Logs</span>
      <button class="refresh-btn" onclick="loadDismissalData()">🔄 Refresh Feed</button>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Student Name</th>
            <th>Location</th>
            <th>Method</th>
          </tr>
        كنولوجي
          <tbody id="logTableBody">
            <tr><td colspan="4" style="text-align:center; color:#64748b;">Loading recent dismissal logs...</td></tr>
          </tbody>
      </table>
    </div>
    <div id="statusMsg">Connected to Apps Script backend</div>
  </div>

  <script>
    // Replace with your actual Apps Script Web App URL if needed
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIop2lsxZmbaF_Wad8Lo0y1hzv092_nRDwXSII8pSbI2U1sJA5mp-uXggxNcEqcBmvsg/exec";

    window.onload = function() {
      loadDismissalData();
      // Auto-refresh every 15 seconds during dismissal
      setInterval(loadDismissalData, 15000);
    };

    function loadDismissalData() {
      var cbName = 'dash_cb_' + Date.now();
      window[cbName] = function(data) {
        var el = document.getElementById(cbName);
        if (el) el.remove();
        delete window[cbName];

        if (Array.isArray(data)) {
          updateDashboardUI(data);
        }
      };

      var script = document.createElement('script');
      script.id = cbName;
      // Request log history from Apps Script backend
      script.src = APPS_SCRIPT_URL + '?callback=' + cbName + '&action=logs';
      script.onerror = function() {
        document.getElementById('statusMsginnerText = '⚠️ Unable to sync live logs (backend offline)';
      };
      document.body.appendChild(script);
    }

    function updateDashboardUI(logs) {
      document.getElementById('totalCount').innerText = logs.length;
      var tbody = document.getElementById('logTableBody');
      tbody.innerHTML = '';

      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b;">No students dismissed yet today.</td></tr>';
        return;
      }

      // Show most recent first (up to 20 rows)
      logs.slice(-20).reverse().forEach(log => {
        var tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${log.timestamp || '--:--'}</td>
          <td style="font-weight:700;">${log.name || log.code}</td>
          <td>${log.location || 'Main'}</td>
          <td><span style="background:#e0f7fa; color:#0b4f6c; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:700;">${log.method || 'Scanned'}</span></td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('statusMsg').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
    }
  </script>
</body>
</html>
