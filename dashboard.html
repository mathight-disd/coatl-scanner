<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0">
  <div class="header-area" style="flex-direction: column; margin-bottom: 8px;">
    </div>
  <title>Edwin J. Kiest Coatls - Teacher Dashboard</title>
  <style>
    :root {
      --coatl-red: #C8232C;
      --coatl-navy: #13264E;
      --coatl-teal: #00A8E8;
      --coatl-bg: #F4F6F9;
      --coatl-card-bg: #FFFFFF;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--coatl-bg);
      color: var(--coatl-navy);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 1050px; margin: auto; }
    .header {
      background: var(--coatl-card-bg);
      padding: 18px 22px;
      border-radius: 12px;
      border-top: 8px solid var(--coatl-red);
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .mascot-avatar {
      width: 50px;
      height: 50px;
      background: var(--coatl-navy);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 22px;
      border: 2px solid var(--coatl-red);
      box-shadow: 0 2px 8px rgba(200, 35, 44, 0.3);
    }
    h2 { margin: 0; color: var(--coatl-navy); text-transform: uppercase; font-size: 20px; letter-spacing: 0.5px; }
    .status-badge {
      background: #e0f7fa; color: #0b4f6c; padding: 6px 14px;
      border-radius: 20px; font-weight: 700; font-size: 13px;
      border: 1px solid #b2ebf2;
    }
    .controls-bar {
      background: var(--coatl-card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      border-left: 6px solid var(--coatl-teal);
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    .controls-bar label { font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--coatl-navy); letter-spacing: 0.5px; }
    .controls-bar select {
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: var(--coatl-navy);
      font-weight: 600;
      min-width: 200px;
      cursor: pointer;
    }
    .controls-bar select:focus {
      border-color: var(--coatl-teal);
      box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.15);
    }
    .table-container {
      background: var(--coatl-card-bg);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      border-bottom: 6px solid var(--coatl-teal);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: var(--coatl-navy);
      color: #ffffff;
      padding: 14px 16px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      color: #1e293b;
      font-weight: 600;
      vertical-align: middle;
    }
    .no-data { text-align: center; padding: 40px; color: #64748b; font-style: italic; background: #ffffff !important; }
    
    .student-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .student-photo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--coatl-teal);
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .student-initials {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--coatl-teal);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      flex-shrink: 0;
    }

    .section-text {
      font-weight: 800;
      font-size: 13px;
    }

    /* Dismissal Location Color Badges */
    .location-badge {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      text-transform: uppercase;
    }
    .loc-carline { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .loc-bus { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .loc-walker { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .loc-daycare { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .loc-default { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="mascot-avatar">🐍</div>
        <div>
          <h2>Edwin J. Kiest Coatls</h2>
          <div style="font-size: 12px; color: var(--coatl-red); font-weight: 800; margin-top: 2px;">LIVE DISMISSAL MONITOR</div>
        </div>
      </div>
      <div class="status-badge" id="liveStatus">🟢 Live Feed Active</div>
    </div>

    <!-- Filter Control Bar -->
    <div class="controls-bar">
      <div class="control-group">
        <label for="gradeFilter">1. Select Grade Level:</label>
        <select id="gradeFilter" onchange="onGradeChange()">
          <option value="ALL">ALL Students</option>
          <option value="Pre-K">Pre-K</option>
          <option value="Kinder">Kinder</option>
          <option value="1st Grade">1st Grade</option>
          <option value="2nd Grade">2nd Grade</option>
          <option value="3rd Grade">3rd Grade</option>
          <option value="4th Grade">4th Grade</option>
          <option value="5th Grade">5th Grade</option>
          <option value="6th Grade">6th Grade</option>
          <option value="FLS & TC">FLS & TC</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sectionFilter">2. Select Section / Homeroom:</label>
        <select id="sectionFilter" onchange="renderTable()">
          <option value="ALL">All Sections</option>
        </select>
      </div>

      <div style="margin-left: auto; font-size: 13px; color: #64748b; font-weight: 600;" id="recordCount">Loading logs...</div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>ID</th>
            <th>Location</th>
            <th>Method</th>
            <th>Section</th>
            <th>Teacher</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="6" class="no-data">Loading recent dismissal logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIop2lsxZmbaF_Wad8Lo0y1hzv092_nRDwXSII8pSbI2U1sJA5mp-uXggxNcEqcBmvsg/exec";

    let cachedLogs = [];

    function fetchLogs() {
      fetch(APPS_SCRIPT_URL + '?action=getLogs')
        .then(response => response.json())
        .then(data => {
          cachedLogs = Array.isArray(data) ? data : [];
          updateSectionDropdown(cachedLogs);
          renderTable();
        })
        .catch(err => {
          console.error("Fetch error:", err);
          document.getElementById('liveStatus').innerText = '🔴 Error loading feed';
        });
    }

    function getSectionGrades(sectionStr) {
      if (!sectionStr) return ["Other"];
      let s = String(sectionStr).trim();
      let upperS = s.toUpperCase();
      let grades = [];

      if (upperS === "7A" || upperS.includes("7A")) {
        return ["Pre-K", "Kinder", "1st Grade", "2nd Grade", "3rd Grade", "4th Grade", "5th Grade", "6th Grade", "FLS & TC"];
      }

      if (upperS.includes("FLS") || upperS.includes("TC")) return ["FLS & TC"];
      if (upperS.includes("PK") || upperS.includes("PRE") || upperS.includes("EC")) return ["Pre-K"];
      if (["KA", "KB", "KC", "KD"].includes(upperS) || upperS.startsWith("K") || upperS.includes("KINDERGARTEN")) return ["Kinder"];
      if (upperS.startsWith("1") || upperS.includes("1ST")) return ["1st Grade"];
      if (upperS.startsWith("2") || upperS.includes("2ND")) return ["2nd Grade"];
      
      // Split level 3rd & 4th grade cross-listing
      if (upperS.startsWith("3") || upperS.includes("3RD")) {
        grades.push("3rd Grade");
        if (upperS === "3A" || upperS === "3B" || upperS.includes("3A") || upperS.includes("3B")) grades.push("4th Grade");
        return grades;
      }
      if (upperS.startsWith("4") && !upperS.includes("FLS") && !upperS.includes("EC")) {
        grades.push("4th Grade");
        if (upperS === "4A" || upperS === "4B" || upperS.includes("4A") || upperS.includes("4B")) grades.push("3rd Grade");
        return grades;
      }

      if (upperS.startsWith("5") || upperS.includes("5TH")) return ["5th Grade"];
      if (upperS.startsWith("6") || upperS.includes("6TH")) return ["6th Grade"];

      return [s];
    }

  // Unique Pastel Row Styling based on the FULL string hash so 2A, 2B, 2C, etc. get completely different colors
    function getRowPastelStyle(sectionName, isFiltered) {
      if (!isFiltered || !sectionName) return '';
      let hash = 0;
      let cleanStr = String(sectionName).trim().toUpperCase();
      
      // Hash every single character in the string for a truly unique color footprint
      for (let i = 0; i < cleanStr.length; i++) {
        hash = cleanStr.charCodeAt(i) + ((hash << 5) - hash);
      }
      
      // Spread across the full 360-degree color wheel using absolute math
      let h = Math.abs(hash * 37) % 360; 
      return `background-color: hsl(${h}, 70%, 93%);`;
    }
    function getAmenityLocationClass(locStr) {
      if (!locStr) return 'loc-default';
      let l = String(locStr).toLowerCase();
      if (l.includes('carline') || l.includes('millmar')) return 'loc-carline';
      if (l.includes('bus')) return 'loc-bus';
      if (l.includes('walk')) return 'loc-walker';
      if (l.includes('daycare') || l.includes('after')) return 'loc-daycare';
      return 'loc-default';
    }

    // RESTORED: Handles dropdown change event cleanly
    function onGradeChange() {
      updateSectionDropdown(cachedLogs);
      renderTable();
    }

    function updateSectionDropdown(data) {
      const selectedGrade = document.getElementById('gradeFilter').value;
      const select = document.getElementById('sectionFilter');
      const currentSelection = select.value;
      
      let filteredData = data;
      if (selectedGrade !== 'ALL') {
        filteredData = data.filter(row => {
          if (!row || !row[7]) return false;
          let grades = getSectionGrades(row[7]);
          return grades.includes(selectedGrade);
        });
      }
      
      const sections = [...new Set(filteredData.map(row => row ? row[7] : "").filter(Boolean))].sort();
      
      let html = '<option value="ALL">All Sections</option>';
      sections.forEach(sec => {
        html += `<option value="${sec}">${sec}</option>`;
      });
      
      select.innerHTML = html;
      select.value = sections.includes(currentSelection) ? currentSelection : 'ALL';
    }

    function renderTable() {
      const tbody = document.getElementById('logTableBody');
      const selectedGrade = document.getElementById('gradeFilter').value;
      const selectedSection = document.getElementById('sectionFilter').value;
      
      tbody.innerHTML = '';

      if (!cachedLogs || cachedLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="no-data">No scans found in the sheet yet.</td></tr>';
        document.getElementById('recordCount').innerText = '0 records';
        return;
      }

      // 1. Sort all raw logs chronologically (newest first)
      let sortedLogs = [...cachedLogs].sort((a, b) => {
        let timeA = (a && a[0]) ? new Date(a[0]).getTime() : 0;
        let timeB = (b && b[0]) ? new Date(b[0]).getTime() : 0;
        if (isNaN(timeA)) timeA = 0;
        if (isNaN(timeB)) timeB = 0;
        return timeB - timeA;
      });

      // 2. Deduplicate: Keep only the FIRST (newest) occurrence of each Student ID
      let uniqueMap = new Map();
      sortedLogs.forEach(row => {
        if (!row || row.length < 8) return;
        let studentId = String(row[1] || '').trim();
        if (studentId && !uniqueMap.has(studentId)) {
          uniqueMap.set(studentId, row);
        }
      });
      let deduplicatedLogs = Array.from(uniqueMap.values());

      // 3. Filter by Grade and Section
      let filtered = deduplicatedLogs.filter(row => {
        let sectionVal = row[7] || "";
        let studentGrades = getSectionGrades(sectionVal);

        let matchesGrade = (selectedGrade === 'ALL' || studentGrades.includes(selectedGrade));
        let matchesSection = (selectedSection === 'ALL' || sectionVal === selectedSection);
        return matchesGrade && matchesSection;
      });

      document.getElementById('recordCount').innerText = `${filtered.length} record(s) shown`;
      document.getElementById('liveStatus').innerText = '🟢 Live Feed Active';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="no-data">No scans match this filter combination.</td></tr>';
        return;
      }

      // Pastel coloring activates whenever Grade Level is NOT 'ALL'
      let isFilteredView = (selectedGrade !== 'ALL');

      filtered.forEach(row => {
        let nameVal = row[6] || 'Unknown';
        let idVal = row[1] || '';
        let locVal = row[2] || 'Carline';
        let methodVal = row[3] || 'Scanned';
        let sectVal = row[7] || '';
        let teachVal = row[8] || '';
        let photoUrl = row[9] || '';

        // Student picture/avatar
        let visualHtml = '';
        if (photoUrl && String(photoUrl).startsWith('http')) {
          visualHtml = `<img src="${photoUrl}" class="student-photo" alt="${nameVal}">`;
        } else {
          let initial = nameVal.charAt(0) !== 'U' ? nameVal.charAt(0) : '?';
          visualHtml = `<div class="student-initials">${initial}</div>`;
        }
        let studentHtml = `<div class="student-cell">${visualHtml}<span style="color:var(--coatl-navy); font-weight:800;">${nameVal}</span></div>`;

        // Color-coded Location Badge
        let locClass = getAmenityLocationClass(locVal);
        let locationHtml = `<span class="location-badge ${locClass}">${locVal}</span>`;

        // Unique Pastel Background per Section
        let rowStyle = getRowPastelStyle(sectVal, isFilteredView);

        let tr = document.createElement('tr');
        if (rowStyle) tr.setAttribute('style', rowStyle);
        tr.innerHTML = '<td>' + studentHtml + '</td>' +
                       '<td>' + idVal + '</td>' +
                       '<td>' + locationHtml + '</td>' +
                       '<td><span style="background:rgba(255,255,255,0.7); color:#334155; padding:3px 8px; border-radius:4px; font-size:11px; border:1px solid rgba(0,0,0,0.1);">' + methodVal + '</span></td>' +
                       '<td><span class="section-text">' + sectVal + '</span></td>' +
                       '<td>' + teachVal + '</td>';
        tbody.appendChild(tr);
      });
    }

    window.onload = function() {
      fetchLogs();
      setInterval(fetchLogs, 5000);
    };
  </script>
</body>
</html>
