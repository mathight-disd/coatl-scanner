<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0">
  <title>Edwin J. Kiest Coatls - Teacher Dashboard</title>
  <style>
    :root {
      --coatl-red: #C8232C;
      --coatl-navy: #13264E;
      --coatl-teal: #00A8E8;
      --coatl-bg: #F4F6F9;
      --coatl-card-bg: #FFFFFF;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--coatl-bg);
      color: var(--coatl-navy);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 1050px; margin: auto; }
    .header {
      background: var(--coatl-card-bg);
      padding: 18px 22px;
      border-radius: 12px;
      border-top: 8px solid var(--coatl-red);
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .mascot-avatar {
      width: 50px;
      height: 50px;
      background: var(--coatl-navy);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 22px;
      border: 2px solid var(--coatl-red);
      box-shadow: 0 2px 8px rgba(200, 35, 44, 0.3);
    }
    h2 { margin: 0; color: var(--coatl-navy); text-transform: uppercase; font-size: 20px; letter-spacing: 0.5px; }
    .status-badge {
      background: #e0f7fa; color: #0b4f6c; padding: 6px 14px;
      border-radius: 20px; font-weight: 700; font-size: 13px;
      border: 1px solid #b2ebf2;
    }
    .controls-bar {
      background: var(--coatl-card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      border-left: 6px solid var(--coatl-teal);
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    .controls-bar label { font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--coatl-navy); letter-spacing: 0.5px; }
    .controls-bar select {
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: var(--coatl-navy);
      font-weight: 600;
      min-width: 200px;
      cursor: pointer;
    }
    .controls-bar select:focus {
      border-color: var(--coatl-teal);
      box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.15);
    }
    .table-container {
      background: var(--coatl-card-bg);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 4px 15px rgba(19, 38, 78, 0.08);
      border-bottom: 6px solid var(--coatl-teal);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: var(--coatl-navy);
      color: #ffffff;
      padding: 14px 16px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
      font-weight: 600;
      vertical-align: middle;
    }
    .no-data { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
    
    .student-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .student-photo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--coatl-teal);
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .student-initials {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--coatl-teal);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      flex-shrink: 0;
    }

    /* Pastel Section Pill / Tag */
    .section-tag {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    /* Dismissal Location Color Badges */
    .location-badge {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      text-transform: uppercase;
    }
    .loc-carline { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .loc-bus { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .loc-walker { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .loc-daycare { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .loc-default { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="mascot-avatar">🐍</div>
        <div>
          <h2>Edwin J. Kiest Coatls</h2>
          <div style="font-size: 12px; color: var(--coatl-red); font-weight: 800; margin-top: 2px;">LIVE DISMISSAL MONITOR</div>
        </div>
      </div>
      <div class="status-badge" id="liveStatus">🟢 Live Feed Active</div>
    </div>

    <!-- Filter Control Bar -->
    <div class="controls-bar">
      <div class="control-group">
        <label for="gradeFilter">1. Select Grade Level:</label>
        <select id="gradeFilter" onchange="onGradeChange()">
          <option value="ALL">ALL Students</option>
          <option value="Pre-K">Pre-K</option>
          <option value="Kinder">Kinder</option>
          <option value="1st Grade">1st Grade</option>
          <option value="2nd Grade">2nd Grade</option>
          <option value="3rd Grade">3rd Grade</option>
          <option value="4th Grade">4th Grade</option>
          <option value="5th Grade">5th Grade</option>
          <option value="6th Grade">6th Grade</option>
          <option value="FLS & TC">FLS & TC</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sectionFilter">2. Select Section / Homeroom:</label>
        <select id="sectionFilter" onchange="renderTable()">
          <option value="ALL">All Sections</option>
        </select>
      </div>

      <div style="margin-left: auto; font-size: 13px; color: #64748b; font-weight: 600;" id="recordCount">Loading logs...</div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>ID</th>
            <th>Location</th>
            <th>Method</th>
            <th>Section</th>
            <th>Teacher</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="6" class="no-data">Loading recent dismissal logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
