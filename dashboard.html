<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0">
  <title>Kiest Coatls Teacher Dashboard</title>
  <style>
    :root {
      --coatl-red: #C8232C;
      --coatl-navy: #13264E;
      --coatl-teal: #00A8E8;
      --coatl-bg: #F4F6F9;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--coatl-bg);
      color: var(--coatl-navy);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 1050px; margin: auto; }
    .header {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      border-top: 8px solid var(--coatl-red);
      box-shadow: 0 4px 12px rgba(19, 38, 78, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .mascot-avatar {
      width: 50px;
      height: 50px;
      background: var(--coatl-navy);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      border: 2px solid var(--coatl-red);
    }
    h2 { margin: 0; color: var(--coatl-navy); text-transform: uppercase; font-size: 20px; letter-spacing: 0.5px; }
    .status-badge {
      background: #e0f7fa; color: #0b4f6c; padding: 6px 14px;
      border-radius: 20px; font-weight: 700; font-size: 13px;
    }
    .controls-bar {
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(19, 38, 78, 0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .controls-bar label { font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--coatl-navy); }
    .controls-bar select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: var(--coatl-navy);
      font-weight: 600;
      min-width: 180px;
    }
    .table-container {
      background: #ffffff;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 4px 12px rgba(19, 38, 78, 0.1);
      border-bottom: 6px solid var(--coatl-teal);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: var(--coatl-navy);
      color: #ffffff;
      padding: 12px 14px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
      font-weight: 600;
      vertical-align: middle;
    }
    tr:hover { background: #f8fafc; }
    .no-data { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
    .student-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .student-photo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--coatl-teal);
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .student-initials {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--coatl-teal);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="mascot-avatar">🐍</div>
        <div>
          <h2>Edwin J. Kiest Coatls</h2>
          <div style="font-size: 12px; color: var(--coatl-red); font-weight: 800; margin-top: 2px;">LIVE DISMISSAL MONITOR</div>
        </div>
      </div>
      <div class="status-badge" id="liveStatus">🟢 Live Feed Active</div>
    </div>

    <!-- Two-Tier Cascading Filter Bar (Grade Level -> Section with 7A Rule) -->
    <div class="controls-bar">
      <div class="control-group">
        <label for="gradeFilter">1. Select Grade Level:</label>
        <select id="gradeFilter" onchange="onGradeChange()">
          <option value="ALL">All Grades (Entire Campus)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sectionFilter">2. Select Section / Homeroom:</label>
        <select id="sectionFilter" onchange="renderTable()">
          <option value="ALL">All Sections</option>
        </select>
      </div>

      <div style="margin-left: auto; font-size: 13px; color: #64748b; font-weight: 600;" id="recordCount">Loading logs...</div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>ID</th>
            <th>Location</th>
            <th>Method</th>
            <th>Section</th>
            <th>Teacher</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="6" class="no-data">Loading recent dismissal logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // PASTE YOUR APPS SCRIPT WEB APP URL HERE:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIop2lsxZmbaF_Wad8Lo0y1hzv092_nRDwXSII8pSbI2U1sJA5mp-uXggxNcEqcBmvsg/exec";

    let cachedLogs = [];

    function fetchLogs() {
      fetch(APPS_SCRIPT_URL + '?action=getLogs')
        .then(response => response.json())
        .then(data => {
          if (!data) data = [];
          cachedLogs = data;
          
          updateGradeDropdown(data);
          updateSectionDropdown(data);
          renderTable();
        })
        .catch(err => {
          document.getElementById('liveStatus').innerText = '🔴 Error loading feed';
        });
    }

    function getGradeKey(sectionStr) {
      if (!sectionStr) return "Other";
      let s = String(sectionStr).trim().toUpperCase();
      if (s.includes("PK") || s.includes("PRE-K") || s.startsWith("7A")) return "Pre-K / 7A";
      if (s.includes("K") || s.startsWith("KG") || s.startsWith("K-")) return "Kindergarten";
      if (s.startsWith("1")) return "1st Grade";
      if (s.startsWith("2")) return "2nd Grade";
      if (s.startsWith("3")) return "3rd Grade";
      if (s.startsWith("4")) return "4th Grade";
      if (s.startsWith("5")) return "5th Grade";
      if (s.startsWith("6")) return "6th Grade";
      return s;
    }

    function updateGradeDropdown(data) {
      const select = document.getElementById('gradeFilter');
      const currentSelection = select.value;
      
      const grades = [...new Set(data.map(row => getGradeKey(row[7])).filter(Boolean))].sort();
      
      let html = '<option value="ALL">All Grades (Entire Campus)</option>';
      grades.forEach(g => {
        html += `<option value="${g}">${g}</option>`;
      });
      
      select.innerHTML = html;
      select.value = grades.includes(currentSelection) ? currentSelection : 'ALL';
    }

    function onGradeChange() {
      updateSectionDropdown(cachedLogs);
      renderTable();
    }

    function updateSectionDropdown(data) {
      const selectedGrade = document.getElementById('gradeFilter').value;
      const select = document.getElementById('sectionFilter');
      const currentSelection = select.value;
      
      let filteredData = data;
      if (selectedGrade !== 'ALL') {
        filteredData = data.filter(row => getGradeKey(row[7]) === selectedGrade);
      }
      
      const sections = [...new Set(filteredData.map(row => row[7]).filter(Boolean))].sort();
      
      let html = '<option value="ALL">All Sections in Grade</option>';
      sections.forEach(sec => {
        html += `<option value="${sec}">${sec}</option>`;
      });
      
      select.innerHTML = html;
      select.value = sections.includes(currentSelection) ? currentSelection : 'ALL';
    }

    function renderTable() {
      const tbody = document.getElementById('logTableBody');
      const selectedGrade = document.getElementById('gradeFilter').value;
      const selectedSection = document.getElementById('sectionFilter').value;
      
      tbody.innerHTML = '';

      if (!cachedLogs || cachedLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="no-data">No scans found in the sheet yet.</td></tr>';
        document.getElementById('recordCount').innerText = '0 records';
        return;
      }

      try {
        let filtered = cachedLogs.filter(row => {
          if (!row || row.length < 8) return false;
          let sectionVal = row[7] || "";
          let matchesGrade = (selectedGrade === 'ALL' || getGradeKey(sectionVal) === selectedGrade);
          let matchesSection = (selectedSection === 'ALL' || sectionVal === selectedSection);
          return matchesGrade && matchesSection;
        });

        // Sort chronologically by timestamp (newest scans at the top)
        filtered.sort((a, b) => {
          let timeA = a[0] ? new Date(a[0]).getTime() : 0;
          let timeB = b[0] ? new Date(b[0]).getTime() : 0;
          return timeB - timeA;
        });

        document.getElementById('recordCount').innerText = `${filtered.length} record(s) shown`;
        document.getElementById('liveStatus').innerText = '🟢 Live Feed Active';

        if (filtered.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="no-data">No scans match this filter combination.</td></tr>';
          return;
        }

        filtered.forEach(row => {
          let nameVal = row[6] || 'Unknown';
          let idVal = row[1] || '';
          let locVal = row[2] || '';
          let methodVal = row[3] || 'Scanned';
          let sectVal = row[7] || '';
          let teachVal = row[8] || '';
          let photoUrl = row[9] || '';

          let visualHtml = '';
          if (photoUrl && String(photoUrl).startsWith('http')) {
            visualHtml = `<img src="${photoUrl}" class="student-photo" alt="${nameVal}">`;
          } else {
            let initial = nameVal.charAt(0) !== 'U' ? nameVal.charAt(0) : '?';
            visualHtml = `<div class="student-initials">${initial}</div>`;
          }

          let studentHtml = `<div class="student-cell">${visualHtml}<span style="color:var(--coatl-navy); font-weight:800;">${nameVal}</span></div>`;

          let tr = document.createElement('tr');
          tr.innerHTML = '<td>' + studentHtml + '</td>' +
                         '<td>' + idVal + '</td>' +
                         '<td>' + locVal + '</td>' +
                         '<td><span style="background:#e2e8f0; padding:3px 8px; border-radius:4px; font-size:11px;">' + methodVal + '</span></td>' +
                         '<td>' + sectVal + '</td>' +
                         '<td>' + teachVal + '</td>';
          tbody.appendChild(tr);
        });

      } catch (e) {
        console.error("Render error:", e);
        document.getElementById('liveStatus').innerText = '🔴 Error rendering table';
      }
    }
